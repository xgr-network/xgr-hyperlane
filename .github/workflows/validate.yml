name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert no populated runtime secrets are tracked
        shell: bash
        run: |
          set -euo pipefail
          test ! -e runtime/.env.validator
          test ! -e runtime/.env.relayer
          test ! -e runtime/.env.validator.beta
          test ! -e runtime/.env.relayer.beta
          if git grep -nE '(^|=)(0x)?[0-9a-fA-F]{64}$' -- runtime ':!runtime/*.example'; then
            echo "Potential raw private key found in tracked runtime files" >&2
            exit 1
          fi

      - name: Validate JSON manifests
        shell: bash
        run: |
          set -euo pipefail
          jq empty deployments/xgrchain-mainnet.json
          jq empty deployments/xgr-base-route.json

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n runtime/bootstrap-beta.sh

      - name: Validate Docker Compose
        shell: bash
        run: |
          set -euo pipefail
          cp runtime/.env.validator.example runtime/.env.validator
          cp runtime/.env.relayer.example runtime/.env.relayer
          docker compose -f runtime/docker-compose.yml config >/dev/null
          cp runtime/.env.validator.beta.example runtime/.env.validator.beta
          cp runtime/.env.relayer.beta.example runtime/.env.relayer.beta
          docker compose -f runtime/docker-compose.beta.yml config >/dev/null
