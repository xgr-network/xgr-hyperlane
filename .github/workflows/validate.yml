name: Validate

on:
  push:
    branches: [main, "feature/native-interchain-registry-v1"]
  pull_request:
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert no populated runtime secrets are tracked
        shell: bash
        run: |
          set -euo pipefail
          test ! -e runtime/.env.relayer
          if git grep -nE '(^|=)(0x)?[0-9a-fA-F]{64}$' -- runtime ':!runtime/*.example'; then
            echo "Potential raw private key found in tracked runtime files" >&2
            exit 1
          fi

      - name: Validate JSON manifests
        shell: bash
        run: |
          set -euo pipefail
          jq empty deployments/xgrchain-mainnet.json
          jq empty deployments/xgr-base-route.json
          jq empty runtime/native-relayer/package.json

      - name: Validate shell and relayer syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n runtime/checkpoint-status.sh
          node --check runtime/native-relayer/index.mjs

      - name: Validate Docker Compose
        shell: bash
        run: |
          set -euo pipefail
          cp runtime/.env.relayer.example runtime/.env.relayer
          docker compose -f runtime/docker-compose.yml config >/dev/null
