name: Hyperlane Beta Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: "preflight validates config; prepare creates keys; rotate replaces beta keys; start launches agents"
        required: true
        default: "preflight"
        type: choice
        options:
          - preflight
          - prepare
          - rotate
          - start
          - status
          - diagnose
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

concurrency:
  group: hyperlane-beta-runtime
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 1 &&
        github.actor == 'oliverboehm-xgr' &&
        (
          github.event.comment.body == '/hyperlane preflight' ||
          github.event.comment.body == '/hyperlane prepare' ||
          github.event.comment.body == '/hyperlane rotate' ||
          github.event.comment.body == '/hyperlane start' ||
          github.event.comment.body == '/hyperlane status' ||
          github.event.comment.body == '/hyperlane diagnose'
        )
      )
    runs-on: ubuntu-latest
    env:
      DEPLOY_ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action || (github.event.comment.body == '/hyperlane preflight' && 'preflight' || github.event.comment.body == '/hyperlane prepare' && 'prepare' || github.event.comment.body == '/hyperlane rotate' && 'rotate' || github.event.comment.body == '/hyperlane start' && 'start' || github.event.comment.body == '/hyperlane diagnose' && 'diagnose' || 'status') }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HYPERLANE_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.HYPERLANE_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${SSH_HOST_KEY}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "${SSH_HOST_KEY}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload runtime package
        if: env.DEPLOY_ACTION != 'status'
        shell: bash
        env:
          HOST: ${{ secrets.HYPERLANE_SSH_HOST }}
          USER: ${{ secrets.HYPERLANE_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "${HOST}"
          test -n "${USER}"
          tar -C runtime \
            --exclude='.env.validator' \
            --exclude='.env.relayer' \
            --exclude='.env.validator.beta' \
            --exclude='.env.relayer.beta' \
            --exclude='runtime-state' \
            -czf /tmp/xgr-hyperlane-runtime.tgz .
          scp -i ~/.ssh/id_rsa /tmp/xgr-hyperlane-runtime.tgz "${USER}@${HOST}:/tmp/xgr-hyperlane-runtime.tgz"
          ssh -i ~/.ssh/id_rsa "${USER}@${HOST}" '
            set -euo pipefail
            install -d -m 700 "$HOME/xgr-hyperlane"
            tar -xzf /tmp/xgr-hyperlane-runtime.tgz -C "$HOME/xgr-hyperlane"
            rm -f /tmp/xgr-hyperlane-runtime.tgz
            chmod 700 "$HOME/xgr-hyperlane/bootstrap-beta.sh" "$HOME/xgr-hyperlane/preflight-beta.sh"
          '

      - name: Preflight Hyperlane configuration
        if: env.DEPLOY_ACTION == 'preflight'
        shell: bash
        env:
          HOST: ${{ secrets.HYPERLANE_SSH_HOST }}
          USER: ${{ secrets.HYPERLANE_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_rsa "${USER}@${HOST}" '
            set -euo pipefail
            cd "$HOME/xgr-hyperlane"
            ./preflight-beta.sh
          '

      - name: Prepare host-local keys
        if: env.DEPLOY_ACTION == 'prepare'
        shell: bash
        env:
          HOST: ${{ secrets.HYPERLANE_SSH_HOST }}
          USER: ${{ secrets.HYPERLANE_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_rsa "${USER}@${HOST}" '
            set -euo pipefail
            cd "$HOME/xgr-hyperlane"
            ./bootstrap-beta.sh
            echo "--- public runtime addresses ---"
            cat runtime-state/addresses.txt
          '

      - name: Rotate closed-beta keys
        if: env.DEPLOY_ACTION == 'rotate'
        shell: bash
        env:
          HOST: ${{ secrets.HYPERLANE_SSH_HOST }}
          USER: ${{ secrets.HYPERLANE_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_rsa "${USER}@${HOST}" '
            set -euo pipefail
            cd "$HOME/xgr-hyperlane"
            ./bootstrap-beta.sh --rotate-keys
            echo "--- new public runtime addresses ---"
            cat runtime-state/addresses.txt
          '

      - name: Start beta runtime
        if: env.DEPLOY_ACTION == 'start'
        shell: bash
        env:
          HOST: ${{ secrets.HYPERLANE_SSH_HOST }}
          USER: ${{ secrets.HYPERLANE_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_rsa "${USER}@${HOST}" '
            set -euo pipefail
            cd "$HOME/xgr-hyperlane"
            ./bootstrap-beta.sh --start
            cat runtime-state/addresses.txt
          '

      - name: Sanitized diagnostics
        if: env.DEPLOY_ACTION == 'diagnose'
        shell: bash
        env:
          HOST: ${{ secrets.HYPERLANE_SSH_HOST }}
          USER: ${{ secrets.HYPERLANE_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_rsa "${USER}@${HOST}" '
            set -euo pipefail
            cd "$HOME/xgr-hyperlane"
            ./diagnose-beta.sh
          '

      - name: Runtime status
        if: env.DEPLOY_ACTION == 'status'
        shell: bash
        env:
          HOST: ${{ secrets.HYPERLANE_SSH_HOST }}
          USER: ${{ secrets.HYPERLANE_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_rsa "${USER}@${HOST}" '
            set -euo pipefail
            cd "$HOME/xgr-hyperlane"
            cat runtime-state/addresses.txt
            docker compose -f docker-compose.beta.yml ps
            for c in xgr-hyperlane-validator-beta xgr-hyperlane-relayer-beta; do
              docker inspect --format "{{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} restarts={{.RestartCount}}" "$c" 2>/dev/null || true
            done
          '
