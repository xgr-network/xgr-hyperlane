services:
  validator:
    image: ghcr.io/hyperlane-xyz/hyperlane-agent:2.3.0
    container_name: xgr-hyperlane-validator-beta
    command: ["./validator"]
    restart: unless-stopped
    env_file:
      - .env.validator.beta
    volumes:
      - ./xgrchain.json:/config/xgrchain.json:ro
      - ./runtime-state/validator-db:/data/validator
      - ./runtime-state/checkpoints:/checkpoints
    ports:
      - "127.0.0.1:9094:9094"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  relayer:
    image: ghcr.io/hyperlane-xyz/hyperlane-agent:2.3.0
    container_name: xgr-hyperlane-relayer-beta
    command: ["./relayer"]
    restart: unless-stopped
    env_file:
      - .env.relayer.beta
    volumes:
      - ./xgrchain.json:/config/xgrchain.json:ro
      - ./runtime-state/relayer-db:/data/relayer
      - ./runtime-state/checkpoints:/checkpoints:ro
    ports:
      - "127.0.0.1:9090:9090"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
